services:
  secret-manager:
    build: .
    container_name: secret-manager
    restart: unless-stopped
    # `restart: unless-stopped` only reacts to process EXIT, never to an
    # `unhealthy` healthcheck. A broken DB handle -> /healthz 503 forever with no
    # recovery. This label opts the container into the autoheal sidecar below,
    # which restarts any container Docker reports as unhealthy.
    labels:
      autoheal: "true"
    env_file: .env
    # Bind to loopback ONLY. Docker publishes on all interfaces by default and
    # its iptables NAT bypasses the host firewall — that would expose the
    # internal-only routes (/api/tokens, /api/exports, /api/import, ...) straight
    # to the internet. The host reverse proxy (Nginx/Caddy/Traefik) is the only
    # thing that should reach the container; it terminates TLS and forwards to
    # 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    # Resource caps: contain a runaway (memory leak, fork bomb) so a single
    # service can't take down the whole VPS. Compose v2 honors these at the
    # service level. Raise mem_limit if PBKDF2/large imports OOM.
    mem_limit: 256m
    pids_limit: 256
    # Give the app time to finish its own graceful shutdown. index.js closes the
    # HTTP server + DB on SIGTERM and has a 10s forced-exit backstop; Docker's
    # DEFAULT grace is also 10s, so it would SIGKILL at exactly the moment the
    # backstop fires — cutting off the SQLite WAL checkpoint mid-write. 30s
    # leaves headroom for the clean path to always win.
    stop_grace_period: 30s
    # BIND MOUNT, NOT a named volume — this is load-bearing, do not "improve" it.
    # The production box's live database is the host file `./data/secrets.db`
    # (bind-mount layout from the original release). Switching to a named volume
    # starts the app against an EMPTY database: every existing secret becomes
    # invisible and every CI pipeline that reads from this vault breaks, while
    # the real data sits untouched on the host. Keep reading the existing file.
    #
    # ON A FRESH BOX ONLY: a bind-mounted `./data` is created root-owned, and the
    # image runs as `USER node` (uid 1000), which then cannot create secrets.db
    # -> SQLITE_CANTOPEN -> crash loop. Pre-create it first:
    #     mkdir -p data && chown 1000:1000 data
    volumes:
      - ./data:/app/data
    healthcheck:
      # `curl` is NOT present in node:22-bookworm-slim, so a curl-based check can
      # never pass and the container stays permanently `unhealthy`. Node 22 ships
      # a stable global fetch — use it instead. start_period covers PBKDF2 key
      # derivation + the startup encryption migration, which delay first boot.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Watches every container labeled `autoheal=true` and restarts it whenever
  # Docker marks it `unhealthy` — the recovery path `restart: unless-stopped`
  # can't provide (that only fires on process exit). `restart: always` keeps the
  # watchdog itself alive across reboots.
  #
  # THIS IS THE HIGHEST-PRIVILEGE CONTAINER IN THIS FILE — not a "low-risk
  # sidecar". Access to the Docker socket is equivalent to root on the host: any
  # container holding it can start a new privileged container with `/` bind
  # mounted and take over the box. Treat any change here as a change to host
  # root, and audit this image before bumping it.
  autoheal:
    # PINNED BY DIGEST, deliberately. Because this container mounts the Docker
    # socket, a mutable `:latest` tag is the biggest supply-chain surface we
    # have: whoever can publish that tag gets host root on the next `docker
    # compose up --build -d`. A digest is immutable content-addressing, so a
    # compromised upstream tag cannot silently change what we run.
    # Bump deliberately with:
    #   docker pull willfarrell/autoheal:latest
    #   docker inspect --format='{{index .RepoDigests 0}}' willfarrell/autoheal:latest
    image: willfarrell/autoheal@sha256:b1a1d5323c8e69eaea7118374ea85cbe5a62713719145869a6bef224ffef5c0f
    container_name: secret-manager-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # ONE-TIME startup delay (seconds) before the autoheal daemon runs its
      # FIRST monitoring cycle — it is NOT a per-container grace period after a
      # restart. It only stops the watchdog from acting on containers that are
      # still legitimately booting when the watchdog itself starts. The
      # per-container boot allowance is the app's own healthcheck
      # `start_period`, above.
      AUTOHEAL_START_PERIOD: "30"
    volumes:
      # `:ro` protects the socket FILE (the inode) from being modified/replaced.
      # It does NOT make the Docker API read-only — the API is request/response
      # over this socket, and a read-only mount still allows full write
      # operations: create/start/exec containers, mount host paths, i.e. host
      # root. The only real mitigations are pinning the image (above) and not
      # running this at all.
      - /var/run/docker.sock:/var/run/docker.sock:ro
